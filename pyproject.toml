[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewgrid"
version = "0.1.0"
description = "A neon desktop inbox for pull-request reviews"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.12,<7"]

[project.scripts]
reviewgrid = "reviewgrid.app:main"

[tool.setuptools.packages.find]
include = ["reviewgrid*"]
